appId: com.velodeck.desktop
productName: VeloDeck
artifactName: "VeloDeck-${version}-${os}-${arch}.${ext}"
asar: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - renderer-dist/**/*
  - assets/**/*
  - build-config.json
  - package.json

extraResources:
  - from: native/bin
    to: native
  - from: native/win-input-helper.ps1
    to: native/win-input-helper.ps1

mac:
  category: public.app-category.utilities
  icon: assets/icon.icns
  darkModeSupport: true
  identity: null
  extendInfo:
    NSScreenCaptureUsageDescription: "VeloDeck 需要屏幕录制权限以将本机画面实时共享给您的远控设备。"
    NSAccessibilityUsageDescription: "VeloDeck 需要辅助功能权限以响应远控端的鼠标移动、点击与键盘输入。"
  target:
    - target: dmg
      arch:
        - arm64

dmg:
  title: "VeloDeck ${version}"

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VeloDeck

linux:
  icon: assets/icon.png
  category: Utility
  target:
    - AppImage
