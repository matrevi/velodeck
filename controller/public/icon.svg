<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Deep OLED pitch-black radial body -->
    <radialGradient id="vd-bg" cx="50%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#171B24" />
      <stop offset="55%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#06080C" />
    </radialGradient>

    <!-- Precision-milled chamfered dark titanium rim -->
    <linearGradient id="vd-rim" x1="48" y1="24" x2="464" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9CA6B8" stop-opacity="0.92" />
      <stop offset="26%" stop-color="#3A4150" stop-opacity="0.88" />
      <stop offset="52%" stop-color="#1A1E27" stop-opacity="0.95" />
      <stop offset="78%" stop-color="#555F70" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1B1F29" stop-opacity="0.95" />
    </linearGradient>

    <!-- Crisp platinum-white monogram fill -->
    <linearGradient id="vd-mark" x1="120" y1="148" x2="396" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#DCE4EE" />
    </linearGradient>

    <!-- Soft ambient emerald LED halo -->
    <radialGradient id="vd-led-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.54" />
      <stop offset="46%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp OLED emerald LED core -->
    <radialGradient id="vd-led-core" cx="42%" cy="38%" r="64%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="62%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>

  <!-- Base OLED squircle + precision titanium chamfer -->
  <rect x="6" y="6" width="500" height="500" rx="116" fill="url(#vd-bg)" stroke="url(#vd-rim)" stroke-width="12" />
  <rect x="18" y="18" width="476" height="476" rx="104" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2" />

  <!-- Continuous geometric V -> D arch ribbon (optically centered: 94px left / 94px right) -->
  <path
    d="M 111 164 L 183 344 L 255 164 L 311 164 A 90 90 0 0 1 311 344 L 249 344"
    stroke="url(#vd-mark)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner slanted-top D stem running strictly parallel to V's right stroke -->
  <path
    d="M 232 344 L 232 306 L 266 221 L 266 344 Z"
    fill="url(#vd-mark)"
  />
  <!-- Rounded bottom-left shoulder join of D -->
  <circle cx="249" cy="344" r="17" fill="url(#vd-mark)" />

  <!-- 7x24 live emerald hardware status LED centered inside the D counter -->
  <circle cx="325" cy="254" r="62" fill="url(#vd-led-halo)" />
  <circle cx="325" cy="254" r="21" fill="url(#vd-led-core)" />
</svg>
